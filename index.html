<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris SVM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .box {
            background: #f7f7fb;
            border-radius: 18px;
            padding: 25px;
        }

        h2 {
            color: #444;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict {
            background: #667eea;
            color: white;
        }

        .predict:hover {
            background: #5568d8;
        }

        .reset {
            background: #ddd;
            color: #333;
        }

        .result {
            height: 100%;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .flower {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result-title {
            color: #888;
            font-size: 14px;
        }

        .result-name {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .message {
            color: #666;
            line-height: 1.6;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        @media (max-width: 700px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌸 Iris SVM Prediction</h1>

    <p class="subtitle">
        Dự đoán loài hoa Iris bằng mô hình Support Vector Machine
    </p>

    <div class="content">

        <!-- NHẬP DỮ LIỆU -->

        <div class="box">

            <h2>🔬 Thông số Iris</h2>

            <label for="sepal_length">
                Sepal Length (cm)
            </label>

            <input
                type="number"
                id="sepal_length"
                value="5.1"
                step="0.1"
            >

            <label for="sepal_width">
                Sepal Width (cm)
            </label>

            <input
                type="number"
                id="sepal_width"
                value="3.5"
                step="0.1"
            >

            <label for="petal_length">
                Petal Length (cm)
            </label>

            <input
                type="number"
                id="petal_length"
                value="1.4"
                step="0.1"
            >

            <label for="petal_width">
                Petal Width (cm)
            </label>

            <input
                type="number"
                id="petal_width"
                value="0.2"
                step="0.1"
            >

            <div class="buttons">

                <button
                    class="predict"
                    onclick="predict()"
                >
                    🔮 Dự đoán
                </button>

                <button
                    class="reset"
                    onclick="resetForm()"
                >
                    ↺ Đặt lại
                </button>

            </div>

        </div>


        <!-- KẾT QUẢ -->

        <div class="box result">

            <div
                class="flower"
                id="flower"
            >
                🌸
            </div>

            <div class="result-title">
                KẾT QUẢ DỰ ĐOÁN
            </div>

            <div
                class="result-name"
                id="result"
            >
                Chưa có kết quả
            </div>

            <div
                class="message"
                id="message"
            >
                Nhập thông số và bấm
                <b>Dự đoán</b>.
            </div>

            <div
                class="status"
                id="status"
            >
                ● Sẵn sàng
            </div>

        </div>

    </div>

</div>


<script>

async function predict() {

    const sepal_length =
        parseFloat(
            document.getElementById("sepal_length").value
        );

    const sepal_width =
        parseFloat(
            document.getElementById("sepal_width").value
        );

    const petal_length =
        parseFloat(
            document.getElementById("petal_length").value
        );

    const petal_width =
        parseFloat(
            document.getElementById("petal_width").value
        );


    const result =
        document.getElementById("result");

    const message =
        document.getElementById("message");

    const flower =
        document.getElementById("flower");

    const status =
        document.getElementById("status");


    if (
        isNaN(sepal_length) ||
        isNaN(sepal_width) ||
        isNaN(petal_length) ||
        isNaN(petal_width)
    ) {

        result.innerText = "Lỗi";

        message.innerText =
            "Vui lòng nhập đầy đủ 4 thông số.";

        flower.innerText = "⚠️";

        status.innerText =
            "● Dữ liệu không hợp lệ";

        return;
    }


    result.innerText =
        "Đang xử lý...";

    message.innerText =
        "Đang gửi dữ liệu đến mô hình SVM.";

    flower.innerText = "🤖";

    status.innerText =
        "● Đang kết nối API";


    try {

        const response = await fetch(
            "/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    sepal_length: sepal_length,
                    sepal_width: sepal_width,
                    petal_length: petal_length,
                    petal_width: petal_width
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail || "API trả về lỗi"
            );

        }


        const prediction =
            data.prediction;


        result.innerText =
            prediction;

        flower.innerText =
            "🌺";

        message.innerText =
            "Mô hình SVM đã hoàn thành dự đoán.";

        status.innerText =
            "● Dự đoán thành công";


    } catch (error) {

        result.innerText =
            "Có lỗi";

        flower.innerText =
            "❌";

        message.innerText =
            error.message;

        status.innerText =
            "● Không thể kết nối API";

    }

}


function resetForm() {

    document.getElementById(
        "sepal_length"
    ).value = "5.1";

    document.getElementById(
        "sepal_width"
    ).value = "3.5";

    document.getElementById(
        "petal_length"
    ).value = "1.4";

    document.getElementById(
        "petal_width"
    ).value = "0.2";


    document.getElementById(
        "result"
    ).innerText =
        "Chưa có kết quả";

    document.getElementById(
        "message"
    ).innerHTML =
        "Nhập thông số và bấm <b>Dự đoán</b>.";

    document.getElementById(
        "flower"
    ).innerText =
        "🌸";

    document.getElementById(
        "status"
    ).innerText =
        "● Sẵn sàng";
}

</script>

</body>
</html>
